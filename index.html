<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System - Dashboard</title>

    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
   
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-radius: 16px;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #1f2937;
        }

        
        .hero-banner {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            border-radius: var(--card-radius);
            padding: 2.5rem;
            color: white;
            box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.4);
            margin-bottom: 2rem;
            position: relative;
            overflow: hidden;
        }

        .hero-banner::after {
            content: '';
            position: absolute;
            right: -50px;
            bottom: -50px;
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }

        
        .stat-card {
            background: white;
            border-radius: var(--card-radius);
            border: none;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease;
        }
        .stat-card:hover {
            transform: translateY(-3px);
        }

        
        .custom-card {
            background: white;
            border-radius: var(--card-radius);
            border: none;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }

        .form-control, .form-select {
            border-radius: 10px;
            padding: 0.75rem 1rem;
            border: 1px solid #e5e7eb;
            font-size: 0.95rem;
        }
        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
        }

        
        .table {
            vertical-align: middle;
        }
        .table thead th {
            background-color: #f9fafb;
            color: #6b7280;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            padding: 1rem;
            border-bottom: 2px solid #f3f4f6;
        }
        .table tbody td {
            padding: 1rem;
            border-bottom: 1px solid #f3f4f6;
        }

        
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: linear-gradient(135deg, #e0e7ff 0%, #c7d2fe 100%);
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        
        .btn-primary-custom {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .btn-primary-custom:hover {
            background-color: var(--primary-hover);
            color: white;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .btn-action {
            width: 35px;
            height: 35px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: none;
            transition: all 0.2s ease;
        }
        .btn-action-edit {
            background-color: #fef3c7;
            color: #d97706;
        }
        .btn-action-edit:hover {
            background-color: #fde68a;
        }
        .btn-action-delete {
            background-color: #fee2e2;
            color: #dc2626;
        }
        .btn-action-delete:hover {
            background-color: #fca5a5;
        }

        
        .badge-jurusan {
            background-color: #e0f2fe;
            color: #0369a1;
            font-weight: 600;
            border-radius: 6px;
            padding: 0.35em 0.75em;
        }
    </style>
</head>
<body>

<div class="container py-4 py-lg-5">
    
   
    <div class="hero-banner d-flex justify-content-between align-items-center">
        <div>
            <span class="badge bg-white text-dark mb-2 px-3 py-2 rounded-pill fw-semibold"><i class="fa-solid fa-sparkles text-warning me-1"></i> Admin Portal</span>
            <h1 class="fw-bold mb-1">Student Management</h1>
            <p class="mb-0 text-white-50">Kelola dan pantau data siswa sekolah terintegrasi REST API.</p>
        </div>
        <div class="d-none d-md-block">
            <i class="fa-solid fa-user-graduate fa-5x text-white-50"></i>
        </div>
    </div>

   
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="stat-card d-flex align-items-center gap-3">
                <div class="avatar"><i class="fa-solid fa-users"></i></div>
                <div>
                    <span class="text-muted small d-block">Total Siswa</span>
                    <h3 class="fw-bold m-0" id="statTotal">0</h3>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stat-card d-flex align-items-center gap-3">
                <div class="avatar" style="background:#dcfce7; color:#15803d;"><i class="fa-solid fa-circle-check"></i></div>
                <div>
                    <span class="text-muted small d-block">Status API</span>
                    <h5 class="fw-bold text-success m-0">Terhubung</h5>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stat-card d-flex align-items-center gap-3">
                <div class="avatar" style="background:#fef3c7; color:#b45309;"><i class="fa-solid fa-clock"></i></div>
                <div>
                    <span class="text-muted small d-block">Terakhir Diperbarui</span>
                    <h6 class="fw-bold m-0" id="statTime">-</h6>
                </div>
            </div>
        </div>
    </div>

    <!-- Form Section -->
    <div class="card custom-card p-4 mb-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold m-0" id="formTitle">
                <i class="fa-solid fa-user-plus text-primary me-2"></i>Tambah Data Siswa Baru
            </h5>
            <button type="button" class="btn btn-sm btn-light" id="btnCancel" style="display:none;" onclick="resetForm()">
                <i class="fa-solid fa-xmark me-1"></i> Batal Edit
            </button>
        </div>

        <form id="siswaForm">
            <input type="hidden" id="siswaId">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label small fw-semibold text-secondary">NIS</label>
                    <input type="text" class="form-control" id="nis" placeholder="Masukan Nis" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-semibold text-secondary">Nama Lengkap</label>
                    <input type="text" class="form-control" id="nama" placeholder="Masukan Nama" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-semibold text-secondary">Kelas</label>
                    <input type="text" class="form-control" id="kelas" placeholder="Masukan Kelas" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-semibold text-secondary">Jurusan</label>
                    <input type="text" class="form-control" id="jurusan" placeholder="Masukan Jurusan" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-semibold text-secondary">Alamat</label>
                    <input type="text" class="form-control" id="alamat" placeholder="Masukan Alamat" required>
                </div>
                <div class="col-12 mt-4 text-end">
                    <button type="submit" class="btn btn-primary-custom" id="btnSubmit">
                        <i class="fa-solid fa-paper-plane me-2"></i>Simpan Data
                    </button>
                </div>
            </div>
        </form>
    </div>


    <div class="card custom-card p-4">
        <div class="row align-items-center mb-3 g-2">
            <div class="col-md-6">
                <h5 class="fw-bold m-0"><i class="fa-solid fa-list text-primary me-2"></i>Daftar Siswa</h5>
            </div>
            <div class="col-md-6">
                <div class="input-group">
                    <span class="input-group-text bg-light border-0"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                    <input type="text" class="form-control bg-light border-0" id="searchInput" placeholder="Cari NIS, Nama, atau Jurusan..." onkeyup="filterTable()">
                </div>
            </div>
        </div>

       
        <div id="loading" class="text-center py-4">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="text-muted small mt-2">Memuat data dari server...</p>
        </div>

        <div class="table-responsive">
            <table class="table table-borderless table-hover" id="mainTable">
                <thead>
                    <tr>
                        <th>Siswa</th>
                        <th>NIS</th>
                        <th>Kelas</th>
                        <th>Jurusan</th>
                        <th>Alamat</th>
                        <th class="text-center">Aksi</th>
                    </tr>
                </thead>
                <tbody id="siswaTable">
                    
                </tbody>
            </table>
        </div>
    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    const API_URL = 'http://localhost:3000/api/siswa';

    const siswaForm = document.getElementById('siswaForm');
    const siswaTable = document.getElementById('siswaTable');
    const loading = document.getElementById('loading');
    const btnSubmit = document.getElementById('btnSubmit');
    const btnCancel = document.getElementById('btnCancel');
    const formTitle = document.getElementById('formTitle');
    const statTotal = document.getElementById('statTotal');
    const statTime = document.getElementById('statTime');

    
    const Toast = Swal.mixin({
        toast: true,
        position: 'top-end',
        showConfirmButton: false,
        timer: 3000,
        timerProgressBar: true
    });

    
    function resetForm() {
        siswaForm.reset();
        document.getElementById('siswaId').value = '';
        btnSubmit.className = 'btn btn-primary-custom';
        btnSubmit.innerHTML = '<i class="fa-solid fa-paper-plane me-2"></i>Simpan Data';
        btnCancel.style.display = 'none';
        formTitle.innerHTML = '<i class="fa-solid fa-user-plus text-primary me-2"></i>Tambah Data Siswa Baru';
    }

    
    function updateTimestamp() {
        const now = new Date();
        statTime.innerText = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
    }

   
    async function loadSiswa() {
        loading.style.display = 'block';
        try {
            const res = await fetch(API_URL);
            const result = await res.json();
            
            siswaTable.innerHTML = '';
            if (result.status && result.data && result.data.length > 0) {
                statTotal.innerText = result.data.length;
                result.data.forEach(siswa => {
                    const initial = siswa.nama ? siswa.nama.charAt(0).toUpperCase() : 'S';
                    siswaTable.innerHTML += `
                        <tr>
                            <td>
                                <div class="d-flex align-items-center gap-3">
                                    <div class="avatar">${initial}</div>
                                    <div>
                                        <h6 class="fw-bold mb-0">${siswa.nama}</h6>
                                    </div>
                                </div>
                            </td>
                            <td class="fw-semibold text-secondary">${siswa.nis}</td>
                            <td><span class="badge bg-light text-dark border px-2 py-1">${siswa.kelas}</span></td>
                            <td><span class="badge badge-jurusan">${siswa.jurusan}</span></td>
                            <td class="text-secondary small">${siswa.alamat}</td>
                            <td class="text-center">
                                <button class="btn-action btn-action-edit me-1" onclick="editSiswa(${siswa.id})" title="Edit">
                                    <i class="fa-solid fa-pen-to-square"></i>
                                </button>
                                <button class="btn-action btn-action-delete" onclick="deleteSiswa(${siswa.id})" title="Hapus">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } else {
                statTotal.innerText = '0';
                siswaTable.innerHTML = `
                    <tr>
                        <td colspan="6" class="text-center text-muted py-5">
                            <i class="fa-solid fa-folder-open fa-3x mb-3 text-secondary"></i>
                            <p class="m-0">Belum ada data siswa tersimpan.</p>
                        </td>
                    </tr>
                `;
            }
            updateTimestamp();
        } catch (err) {
            Toast.fire({ icon: 'error', title: 'Gagal menghubungkan ke server' });
        } finally {
            loading.style.display = 'none';
        }
    }

   
    siswaForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const id = document.getElementById('siswaId').value;
        const payload = {
            nis: document.getElementById('nis').value,
            nama: document.getElementById('nama').value,
            kelas: document.getElementById('kelas').value,
            jurusan: document.getElementById('jurusan').value,
            alamat: document.getElementById('alamat').value,
        };

        const method = id ? 'PUT' : 'POST';
        const url = id ? `${API_URL}/${id}` : API_URL;

        try {
            const res = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const result = await res.json();

            if (res.ok) {
                Toast.fire({ icon: 'success', title: result.message });
                resetForm();
                loadSiswa();
            } else {
                Toast.fire({ icon: 'error', title: result.message });
            }
        } catch (err) {
            Toast.fire({ icon: 'error', title: 'Gagal menyimpan data' });
        }
    });

   
    async function editSiswa(id) {
        try {
            const res = await fetch(`${API_URL}/${id}`);
            const result = await res.json();
            
            if (result.status) {
                const s = result.data;
                document.getElementById('siswaId').value = s.id;
                document.getElementById('nis').value = s.nis;
                document.getElementById('nama').value = s.nama;
                document.getElementById('kelas').value = s.kelas;
                document.getElementById('jurusan').value = s.jurusan;
                document.getElementById('alamat').value = s.alamat;
                
                btnSubmit.className = 'btn btn-warning text-white px-4 fw-semibold';
                btnSubmit.innerHTML = '<i class="fa-solid fa-rotate me-2"></i>Update Data';
                btnCancel.style.display = 'inline-block';
                formTitle.innerHTML = '<i class="fa-solid fa-user-pen text-warning me-2"></i>Edit Data Siswa';
                
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        } catch (err) {
            Toast.fire({ icon: 'error', title: 'Gagal mengambil data' });
        }
    }

    
    async function deleteSiswa(id) {
        const confirm = await Swal.fire({
            title: 'Apakah Anda yakin?',
            text: "Data siswa ini akan dihapus permanen!",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#ef4444',
            cancelButtonColor: '#6b7280',
            confirmButtonText: 'Ya, Hapus!',
            cancelButtonText: 'Batal'
        });

        if (!confirm.isConfirmed) return;

        try {
            const res = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            const result = await res.json();

            if (res.ok) {
                Toast.fire({ icon: 'success', title: result.message });
                loadSiswa();
            } else {
                Toast.fire({ icon: 'error', title: result.message });
            }
        } catch (err) {
            Toast.fire({ icon: 'error', title: 'Gagal menghapus data' });
        }
    }

    
    function filterTable() {
        const input = document.getElementById('searchInput').value.toLowerCase();
        const rows = siswaTable.getElementsByTagName('tr');

        for (let row of rows) {
            const text = row.innerText.toLowerCase();
            row.style.display = text.includes(input) ? '' : 'none';
        }
    }

    
    loadSiswa();
</script>

</body>
</html>
